# Install:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/glucose-dashboard.conf /etc/nginx/sites-available/glucose-dashboard
#   sudo ln -s /etc/nginx/sites-available/glucose-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d glucose-dashboard.duckdns.org
#
# certbot rewrites this file in place (adds the ssl_certificate lines below
# and the http->https redirect server block) — this copy reflects that
# post-certbot state so it can be reapplied as-is on a fresh VPS.

server {
    server_name glucose-dashboard.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/glucose-dashboard.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/glucose-dashboard.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = glucose-dashboard.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name glucose-dashboard.duckdns.org;
    return 404; # managed by Certbot
}
