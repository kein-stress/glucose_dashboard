<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glucose × Workout Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Glucose × Workout Dashboard</h1>
    <p class="subtitle">Наблюдательный дашборд. Не источник рекомендаций по дозировке.</p>
  </header>

  <main>
    <section class="panel" id="form-panel">
      <h2>Новая тренировка</h2>
      <form id="workout-form">
        <label>
          Категория
          <select name="category" required>
            <option value="strength">Силовая</option>
            <option value="cardio">Кардио</option>
            <option value="mobility">Мобильность/растяжка</option>
            <option value="other">Другое</option>
          </select>
        </label>

        <label>
          Начало
          <input type="datetime-local" name="start_time" required />
        </label>

        <label>
          Конец
          <input type="datetime-local" name="end_time" required />
        </label>

        <label>
          Интенсивность (1–10)
          <input type="number" name="intensity" min="1" max="10" />
        </label>

        <label>
          Теги (через запятую)
          <input type="text" name="tags" placeholder="ноги, база, зал" />
        </label>

        <label>
          Заметки
          <textarea name="notes" rows="2"></textarea>
        </label>

        <button type="submit">Сохранить тренировку</button>
      </form>
      <p id="form-error" class="error" hidden></p>
    </section>

    <section class="panel" id="list-panel">
      <h2>Тренировки</h2>
      <ul id="workout-list"></ul>
    </section>

    <section class="panel" id="chart-panel">
      <h2>Глюкоза вокруг тренировки</h2>
      <label class="window-control">
        Окно вокруг тренировки, часы:
        <input type="number" id="window-input" min="0" max="12" step="0.5" value="2" />
      </label>
      <canvas id="glucose-chart" height="120"></canvas>
      <p id="chart-placeholder">Выбери тренировку из списка слева.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
